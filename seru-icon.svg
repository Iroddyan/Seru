<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Seru" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6D52F0"/>
      <stop offset="1" stop-color="#241A63"/>
    </linearGradient>
    <linearGradient id="cel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E0FF"/>
    </linearGradient>
    <clipPath id="iconClip"><rect x="32" y="32" width="448" height="448" rx="108"/></clipPath>
    <clipPath id="frontClip"><rect x="110" y="150" width="292" height="222" rx="26"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0E0833" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- icon base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>
  <g clip-path="url(#iconClip)">
    <circle cx="420" cy="90" r="190" fill="#FFFFFF" opacity="0.06"/>

    <!-- stacked cels (the library) -->
    <g transform="rotate(-10 256 262)">
      <rect x="110" y="150" width="292" height="222" rx="26" fill="#FFFFFF" opacity="0.22"/>
    </g>
    <g transform="rotate(-5 256 262)">
      <rect x="110" y="150" width="292" height="222" rx="26" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- front cel -->
    <g filter="url(#shadow)">
      <rect x="110" y="150" width="292" height="222" rx="26" fill="url(#cel)"/>
    </g>
    <g clip-path="url(#frontClip)">
      <!-- glossy acetate streak -->
      <polygon points="300,150 372,150 252,372 180,372" fill="#FFFFFF" opacity="0.35"/>
    </g>

    <!-- registration peg holes: 2 round + 1 slot -->
    <circle cx="170" cy="188" r="12" fill="#2A1E78"/>
    <rect x="234" y="176" width="44" height="24" rx="12" fill="#2A1E78"/>
    <circle cx="342" cy="188" r="12" fill="#2A1E78"/>

    <!-- play mark, cel-shaded: flat colour + one hard-edged shadow shape -->
    <mask id="playMask">
      <polygon points="236,244 236,334 316,289" fill="#fff" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
    </mask>
    <g mask="url(#playMask)">
      <rect x="200" y="210" width="150" height="160" fill="#FF5D7A"/>
      <path d="M200 304 Q268 312 350 266 L350 370 L200 370 Z" fill="#D93A63"/>
    </g>
  </g>
</svg>
